<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptBlueprint v1.0.0</title>
    <style>
        :root {
            --fondo: #1e1e24;
            --panel: #2a2b36;
            --panel2: #353647;
            --borde: #3f4052;
            --texto: #e6e6f0;
            --texto-suave: #a5a6c4;
            --acento: #2563eb;
            --acento2: #4caf50;
            --peligro: #e5484d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: var(--fondo); color: var(--texto); overflow: hidden; }

        /* ===== Barra superior ===== */
        #barra {
            height: 52px; flex-shrink: 0; background: var(--panel);
            border-bottom: 2px solid var(--borde); display: flex; align-items: center; gap: 8px; padding: 0 12px; flex-wrap: wrap;
        }
        #barra .titulo { font-weight: 800; font-size: 15px; letter-spacing: .5px; margin-right: 8px; white-space: nowrap; }
        #barra .titulo span { color: var(--acento2); }
        .btn {
            background: var(--panel2); color: var(--texto); border: 1px solid var(--borde); padding: 6px 12px;
            border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12.5px; transition: background .15s; white-space: nowrap;
        }
        .btn:hover { background: #4a4b60; }
        .btn.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
        .btn.verde { background: var(--acento2); border-color: var(--acento2); color: #fff; }
        .btn.verde:hover { background: #45a049; }
        .btn.ico { padding: 6px 9px; }
        #barra .sep { width: 1px; height: 26px; background: var(--borde); margin: 0 4px; }
        #barra label { font-size: 11.5px; color: var(--texto-suave); display: flex; align-items: center; gap: 4px; }
        #barra input[type=number] {
            width: 62px; background: var(--fondo); color: var(--texto); border: 1px solid var(--borde);
            border-radius: 5px; padding: 4px 6px; font-size: 12px;
        }
        #barra input[type=color] { width: 34px; height: 28px; border: 1px solid var(--borde); border-radius: 5px; background: none; cursor: pointer; padding: 0; }
        #barra select {
            background: var(--fondo); color: var(--texto); border: 1px solid var(--borde); border-radius: 5px; padding: 4px 6px; font-size: 12px;
        }

        /* ===== Cuerpo ===== */
        #cuerpo { flex: 1; display: flex; min-height: 0; }

        /* ===== Panel izquierdo (paleta) ===== */
        #panel {
            width: 270px; flex-shrink: 0; background: var(--panel); border-right: 2px solid var(--borde);
            display: flex; flex-direction: column; transition: width .25s ease, min-width .25s ease; overflow: hidden; min-width: 0;
        }
        #panel.oculto { width: 0; border-right: none; }
        #panel .panel-interior { width: 270px; display: flex; flex-direction: column; height: 100%; min-width: 270px; }
        #panel-cabecera { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--borde); }
        #panel-cabecera h3 { font-size: 13px; color: var(--texto-suave); letter-spacing: 1px; text-transform: uppercase; }
        #panel-cabecera .fila { display: flex; gap: 6px; }
        #buscar {
            flex: 1; background: var(--fondo); color: var(--texto); border: 1px solid var(--borde);
            border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
        }
        #buscar:focus { border-color: var(--acento); }
        #arbol { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .seccion { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
        .seccion-cabecera {
            display: flex; align-items: center; gap: 6px; padding: 8px 10px; cursor: pointer; user-select: none;
        }
        .seccion-cabecera:hover { background: #3d3e50; }
        .seccion-cabecera .flecha { width: 14px; color: var(--texto-suave); font-size: 11px; transition: transform .15s; }
        .seccion-cerrada .flecha { transform: rotate(-90deg); }
        .seccion-cabecera .nombre { flex: 1; font-weight: 700; font-size: 13px; }
        .seccion-cabecera .contador { font-size: 11px; color: var(--texto-suave); background: var(--fondo); border-radius: 10px; padding: 1px 7px; }
        .seccion-acciones { display: none; gap: 3px; }
        .seccion-cabecera:hover .seccion-acciones { display: flex; }
        .seccion-acciones .mini {
            background: none; border: none; color: var(--texto-suave); cursor: pointer; font-size: 13px; width: 22px; height: 22px; border-radius: 4px;
        }
        .seccion-acciones .mini:hover { background: var(--acento); color: #fff; }
        .seccion-acciones .mini.del:hover { background: var(--peligro); }
        .seccion-cuerpo { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .seccion-cerrada .seccion-cuerpo { display: none; }
        .elemento-chip {
            background: var(--fondo); border: 1px solid var(--borde); border-radius: 6px; padding: 7px 10px;
            cursor: grab; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; user-select: none;
            transition: background .15s, border-color .15s;
        }
        .elemento-chip:hover { background: #3d3e50; border-color: var(--acento); }
        .elemento-chip:active { cursor: grabbing; }
        .elemento-chip .emoji { font-size: 14px; }
        .elemento-chip .etq { flex: 1; }
        .subsecciones { display: flex; flex-direction: column; gap: 6px; }
        .resultado-vacio { color: var(--texto-suave); font-size: 12.5px; text-align: center; padding: 20px 10px; }

        /* ===== Zona de lienzo ===== */
        #contenedor-lienzo { flex: 1; overflow: auto; display: flex; background: #13141a; padding: 30px; position: relative; min-width: 0; }
        #lienzo {
            background: #ffffff; border-radius: 6px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.5);
            margin: auto; flex-shrink: 0; transition: width .1s, height .1s;
        }
        #lienzo.modo-cuadricula { display: grid; align-content: start; }
        #lienzo.cuadricula {
            background-image:
                linear-gradient(to right, rgba(37,99,235,.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(37,99,235,.06) 1px, transparent 1px);
        }
        #mango-lienzo {
            position: absolute; right: -10px; bottom: -10px; width: 20px; height: 20px; cursor: nwse-resize; z-index: 30;
            background: var(--acento); border-radius: 3px 3px 6px 3px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .mango-label {
            position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); font-size: 11px; color: var(--texto-suave); white-space: nowrap;
        }

        /* ===== Elementos dentro del lienzo ===== */
        .elemento-web {
            position: relative; display: flex; align-items: center; justify-content: center; padding: 6px;
            font-size: 14px; color: #111; background: #f0f0f0; min-width: 24px; min-height: 20px; cursor: move;
            overflow: visible; line-height: 1.3;
        }
        .elemento-web.cuadricula { position: relative; }
        .elemento-web.es-contenedor { padding: 8px; }
        .elemento-web .el-texto { pointer-events: none; user-select: none; width: 100%; word-break: break-word; }
        .elemento-web .pista {
            color: #b0b0b0; font-size: 11px; font-style: italic; opacity: .8; pointer-events: none; user-select: none;
        }
        .elemento-web .hijo { flex: none; }
        .elemento-web.seleccionado { outline: 2px solid var(--acento); outline-offset: 1px; z-index: 10; }
        .handle {
            position: absolute; width: 10px; height: 10px; background: #fff; border: 2px solid var(--acento);
            z-index: 50; border-radius: 2px;
        }
        .handle.n  { top: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .handle.s  { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .handle.e  { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .handle.w  { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        .handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }

        /* Animaciones */
        @keyframes animFade { from { opacity: 0; } to { opacity: 1; } }
        .anim-fade { animation: animFade 1.2s ease both; }
        @keyframes animPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37,99,235,.45); }
            70% { box-shadow: 0 0 0 14px rgba(37,99,235,0); }
        }
        .anim-pulse { animation: animPulse 1.6s infinite; }
        @keyframes animSpin { to { transform: rotate(360deg); } }
        .anim-spin .el-texto { animation: animSpin 1.2s linear infinite; }
        @keyframes animBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }
        .anim-bounce { animation: animBounce 1s ease-in-out infinite; }
        @keyframes animSlide { from { transform: translateX(-46px); opacity: 0; } to { transform: none; opacity: 1; } }
        .anim-slide { animation: animSlide .6s ease both; }
        @keyframes animBrillo { from { background-position: -400px 0; } to { background-position: 400px 0; } }
        .anim-carga { background: linear-gradient(90deg, #e6e6e6 25%, #f8f8f8 37%, #e6e6e6 63%); background-size: 400px 100%; animation: animBrillo 1.4s infinite; }

        /* ===== Panel de edición (clic derecho) ===== */
        #panel-editor {
            position: absolute; left: 0; top: 0; bottom: 0; width: 300px; background: var(--panel);
            border-right: 2px solid var(--acento); z-index: 60; transform: translateX(-102%); transition: transform .22s ease;
            display: flex; flex-direction: column; box-shadow: 6px 0 20px rgba(0,0,0,.4);
        }
        #panel-editor.abierto { transform: translateX(0); }
        #editor-cabecera {
            padding: 12px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; gap: 8px; background: var(--panel2);
        }
        #editor-cabecera h4 { flex: 1; font-size: 13px; }
        #editor-cabecera .etiqueta-tipo { font-size: 10.5px; color: var(--texto-suave); background: var(--fondo); padding: 2px 8px; border-radius: 10px; }
        #editor-cuerpo { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        #editor-cuerpo .grupo { display: flex; flex-direction: column; gap: 6px; }
        #editor-cuerpo .grupo label { font-size: 11px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .5px; }
        #editor-cuerpo .grupo .fila { display: flex; align-items: center; gap: 8px; }
        #editor-cuerpo input[type=text], #editor-cuerpo textarea, #editor-cuerpo select, #editor-cuerpo input[type=number] {
            background: var(--fondo); color: var(--texto); border: 1px solid var(--borde); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; width: 100%; outline: none;
        }
        #editor-cuerpo input[type=text]:focus, #editor-cuerpo textarea:focus, #editor-cuerpo select:focus { border-color: var(--acento); }
        #editor-cuerpo textarea { resize: vertical; min-height: 52px; }
        #editor-cuerpo input[type=color] { width: 44px; height: 32px; border: 1px solid var(--borde); border-radius: 6px; background: none; cursor: pointer; padding: 2px; }
        #editor-cuerpo input[type=range] { flex: 1; accent-color: var(--acento); }
        #editor-cuerpo .valor { width: 42px; text-align: right; font-size: 12px; color: var(--texto-suave); }
        #editor-cuerpo input[type=checkbox] { accent-color: var(--acento); width: 16px; height: 16px; }
        #editor-cuerpo .fila-cb { display: flex; align-items: center; gap: 8px; }
        #editor-acciones { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px; border-top: 1px solid var(--borde); background: var(--panel2); }
        #editor-acciones .btn { flex: 1; min-width: 60px; text-align: center; }
        .cerrar-editor { background: none; border: none; color: var(--texto-suave); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
        .cerrar-editor:hover { color: #fff; background: var(--peligro); }

        /* ===== Popover añadir elemento ===== */
        #popover {
            position: fixed; z-index: 80; background: var(--panel); border: 1px solid var(--borde); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 320px; overflow-y: auto; padding: 8px; display: none; width: 240px;
        }
        #popover.abierto { display: block; }
        #popover .cat { font-size: 10.5px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .5px; margin: 8px 4px 4px; }
        #popover .opcion { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
        #popover .opcion:hover { background: var(--acento); color: #fff; }

        /* ===== Botón y panel FAQ ===== */
        #boton-faq {
            position: fixed; right: 20px; bottom: 20px; width: 46px; height: 46px; border-radius: 50%;
            background: var(--acento); color: #fff; border: none; font-size: 22px; font-weight: 800; cursor: pointer; z-index: 70;
            box-shadow: 0 4px 14px rgba(37,99,235,.5); transition: transform .15s;
        }
        #boton-faq:hover { transform: scale(1.08); }
        #panel-faq {
            position: fixed; right: 20px; bottom: 76px; width: 330px; max-height: 420px; background: var(--panel);
            border: 1px solid var(--borde); border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.55); z-index: 70;
            display: none; flex-direction: column; overflow: hidden;
        }
        #panel-faq.abierto { display: flex; }
        #faq-cabecera { padding: 12px 14px; background: var(--panel2); border-bottom: 1px solid var(--borde); display: flex; align-items: center; gap: 8px; }
        #faq-cabecera h4 { flex: 1; font-size: 14px; }
        #faq-cuerpo { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .faq-item { border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
        .faq-pregunta { padding: 9px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
        .faq-pregunta:hover { background: var(--panel2); }
        .faq-pregunta .num { color: var(--acento); font-weight: 800; }
        .faq-respuesta { display: none; padding: 4px 12px 11px; font-size: 12px; color: var(--texto-suave); line-height: 1.5; border-top: 1px dashed var(--borde); margin-top: 4px; padding-top: 8px; }
        .faq-item.abierto .faq-respuesta { display: block; }

        /* ===== Modal exportar ===== */
        #modal-exportar {
            position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; display: none; align-items: center; justify-content: center; padding: 30px;
        }
        #modal-exportar.abierto { display: flex; }
        #modal-caja {
            background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; width: 680px; max-width: 100%; max-height: 90vh;
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.6);
        }
        #modal-cabecera { padding: 14px 16px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; gap: 10px; background: var(--panel2); }
        #modal-cabecera h3 { flex: 1; font-size: 14px; }
        #modal-cuerpo { padding: 14px; overflow: auto; }
        #json-salida {
            width: 100%; min-height: 340px; background: #0e0f14; color: #00e5a0; border: 1px solid var(--borde);
            border-radius: 8px; padding: 12px; font-family: Consolas, monospace; font-size: 12px; resize: vertical; white-space: pre;
        }
        #modal-acciones { padding: 12px 14px; border-top: 1px solid var(--borde); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel2); }

        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: #4a4b60; border-radius: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>

    <!-- ===== BARRA SUPERIOR ===== -->
    <div id="barra">
        <div class="titulo">Prompt<span>Blueprint</span> <span style="color:#a5a6c4;font-size:11px;">v1.0.0</span></div>

        <button class="btn" id="btn-panel" onclick="togglePanel()" title="Mostrar / ocultar la paleta de elementos">◧ Panel</button>

        <div class="sep"></div>
        <button class="btn" id="btn-modo" onclick="toggleModo()" title="Alternar entre cuadrícula y modo libre"></button>
        <button class="btn verde" onclick="autoAcomodar()" title="Acomodar todos los elementos automáticamente en cuadrículas">▦ Auto-acomodar</button>

        <div class="sep"></div>
        <label>Tamaño lienzo</label>
        <input type="number" id="ent-ancho" value="1280" min="200" max="4000" onchange="aplicarTamanoLienzo()" title="Ancho del lienzo">
        <span style="color:#a5a6c4;">×</span>
        <input type="number" id="ent-alto" value="720" min="150" max="3000" onchange="aplicarTamanoLienzo()" title="Alto del lienzo">
        <select id="sel-preset" onchange="aplicarPreset()" title="Tamaños predefinidos">
            <option value="">Presets…</option>
            <option value="1280,720">Escritorio (1280×720)</option>
            <option value="1440,900">Escritorio grande (1440×900)</option>
            <option value="768,1024">Tablet (768×1024)</option>
            <option value="390,844">Móvil (390×844)</option>
            <option value="375,667">Móvil pequeño (375×667)</option>
        </select>
        <label>Fondo</label>
        <input type="color" id="ent-fondo" value="#ffffff" onchange="aplicarFondo()" title="Color de fondo del lienzo">

        <div class="sep"></div>
        <button class="btn verde" onclick="exportar()" title="Exportar el diseño como JSON para tu IA">⇩ Exportar JSON</button>
    </div>

    <!-- ===== CUERPO ===== -->
    <div id="cuerpo">

        <!-- Panel izquierdo: paleta -->
        <div id="panel">
            <div class="panel-interior">
                <div id="panel-cabecera">
                    <h3>Elementos</h3>
                    <input type="text" id="buscar" placeholder="🔍 Buscar elementos…" oninput="renderPaleta()">
                    <div class="fila">
                        <button class="btn" style="flex:1;" onclick="nuevaSeccion()">＋ Nueva sección</button>
                        <button class="btn ico" onclick="nuevaSeccion(null, true)" title="Añadir una subsección">⇩ Sub</button>
                    </div>
                </div>
                <div id="arbol"></div>
            </div>
        </div>

        <!-- Zona de lienzo -->
        <div id="contenedor-lienzo">
            <div id="lienzo">
                <div id="mango-lienzo" title="Arrastra para redimensionar el lienzo"></div>
                <div class="mango-label" id="label-mango"></div>
            </div>

            <!-- Panel de edición (clic derecho) -->
            <div id="panel-editor">
                <div id="editor-cabecera">
                    <h4>Propiedades</h4>
                    <span class="etiqueta-tipo" id="etiqueta-tipo"></span>
                    <button class="cerrar-editor" onclick="cerrarEditor()" title="Cerrar">✕</button>
                </div>
                <div id="editor-cuerpo"></div>
                <div id="editor-acciones">
                    <button class="btn" onclick="accionEditor('subir')" title="Intercambiar arriba">▲ Subir</button>
                    <button class="btn" onclick="accionEditor('bajar')" title="Intercambiar abajo">▼ Bajar</button>
                    <button class="btn" onclick="accionEditor('desanidar')" title="Sacar de la sección contenedora">↩ Desanidar</button>
                    <button class="btn" onclick="accionEditor('duplicar')" title="Duplicar elemento">⧉ Duplicar</button>
                    <button class="btn" style="background:var(--peligro);border-color:var(--peligro);" onclick="accionEditor('eliminar')" title="Eliminar elemento">✕ Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón y panel FAQ -->
    <button id="boton-faq" onclick="toggleFaq()" title="Preguntas y respuestas">?</button>
    <div id="panel-faq">
        <div id="faq-cabecera">
            <h4>Ayuda de PromptBlueprint</h4>
            <button class="cerrar-editor" onclick="toggleFaq()">✕</button>
        </div>
        <div id="faq-cuerpo"></div>
    </div>

    <!-- Modal exportar -->
    <div id="modal-exportar">
        <div id="modal-caja">
            <div id="modal-cabecera">
                <h3>JSON para tu IA</h3>
                <button class="cerrar-editor" onclick="cerrarModal()">✕</button>
            </div>
            <div id="modal-cuerpo">
                <textarea id="json-salida" readonly spellcheck="false"></textarea>
            </div>
            <div id="modal-acciones">
                <button class="btn" onclick="copiarJson()">📋 Copiar</button>
                <button class="btn verde" onclick="descargarJson()">💾 Descargar .json</button>
            </div>
        </div>
    </div>

    <!-- Popover para añadir elementos a una sección -->
    <div id="popover"></div>

    <script>
    /* ============================================================
       PROMPTBLUEPRINT v1.0.0
       ============================================================ */
    const COLUMNAS = 12;
    const GAP = 8;
    const ALTO_FILA = 56;

    /* ---------- Registro de tipos de elementos ---------- */
    const TIPOS = {
        boton:        { label:'Botón',        cat:'Básicos', w:120, h:40,  span:3, bg:'#2563eb', color:'#ffffff', radio:8,  texto:'Botón',    emoji:'🔘' },
        texto:        { label:'Texto',        cat:'Básicos', w:170, h:26,  span:4, bg:'transparent', color:'#111111', radio:0, texto:'Texto de ejemplo', emoji:'🔤' },
        titulo:       { label:'Título',       cat:'Básicos', w:280, h:44,  span:6, bg:'transparent', color:'#111111', radio:0, fontSize:28, negrita:true, texto:'Título de la página', emoji:'🔠' },
        parrafo:      { label:'Párrafo',      cat:'Básicos', w:280, h:64,  span:6, bg:'transparent', color:'#333333', radio:0, fontSize:14, texto:'Este es un párrafo de ejemplo que describe el contenido de la sección.', emoji:'📄' },

        rebote:       { label:'Caja rebote',  cat:'Animaciones', w:110, h:60, span:4, bg:'#f59e0b', color:'#ffffff', radio:10, texto:'Rebote', anim:'bounce', emoji:'🏀' },
        deslizar:     { label:'Panel deslizante', cat:'Animaciones', w:280, h:80, span:7, bg:'#10b981', color:'#ffffff', radio:10, texto:'← Se desliza', anim:'slide', emoji:'🎯' },
        carga:        { label:'Carga animada', cat:'Animaciones', w:200, h:44, span:6, bg:'transparent', color:'#94a3b8', radio:6, texto:'Cargando contenido…', anim:'carga', emoji:'🌊' },
    };

    const CATEGORIAS = ['Básicos','Formularios','Contenedores','Navegación','Medios','Datos','Animaciones'];

    /* ---------- Paleta (secciones jerárquicas) ---------- */
    let contadorSeccion = 0;
    function nuevaSeccionObj(nombre, tipos) {
        return { id: 'sec_' + (++contadorSeccion), nombre, tipos: tipos || [], subs: [], abierto: true };
    }
    let paleta = CATEGORIAS.map(cat => {
        const tipos = Object.keys(TIPOS).filter(k => TIPOS[k].cat === cat);
        return nuevaSeccionObj(cat, tipos);
    });

    /* ---------- Estado del lienzo ---------- */
    const elementos = new Map();
    let raices = [];
    let contadorId = 1;
    let seleccionId = null;
    let modo = 'cuadricula';
    let lienzoAncho = 1280, lienzoAlto = 720, lienzoFondo = '#ffffff';

    /* ============================================================
       PALETA
       ============================================================ */
    function norm(s) {
        return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function renderPaleta() {
        const arbol = document.getElementById('arbol');
        const q = norm(document.getElementById('buscar').value.trim());
        arbol.innerHTML = '';
        if (q) { renderBusqueda(arbol, q); return; }
        paleta.forEach(sec => arbol.appendChild(renderSeccion(sec)));
        if (!paleta.length) arbol.innerHTML = '<div class="resultado-vacio">Crea una sección para empezar.</div>';
    }

    function renderBusqueda(arbol, q) {
        const resultados = [];
        const recorrer = (sec, ruta) => {
            const rutaActual = ruta ? ruta + ' / ' + sec.nombre : sec.nombre;
            if (norm(sec.nombre).includes(q)) {
                sec.tipos.forEach(t => resultados.push({ tipo: t, ruta: rutaActual }));
            } else {
                sec.tipos.forEach(t => {
                    if (norm(TIPOS[t].label).includes(q)) resultados.push({ tipo: t, ruta: rutaActual });
                });
            }
            sec.subs.forEach(s => recorrer(s, rutaActual));
        };
        paleta.forEach(s => recorrer(s, ''));
        if (!resultados.length) { arbol.innerHTML = '<div class="resultado-vacio">Sin resultados para «' + q + '».</div>'; return; }
        const cont = document.createElement('div');
        cont.className = 'seccion';
        const cab = document.createElement('div');
        cab.className = 'seccion-cabecera';
        cab.innerHTML = '<span class="flecha">▾</span><span class="nombre">Resultados (' + resultados.length + ')</span>';
        cont.appendChild(cab);
        const cuerpo = document.createElement('div');
        cuerpo.className = 'seccion-cuerpo';
        resultados.forEach(r => cuerpo.appendChild(chip(r.tipo, r.ruta)));
        cont.appendChild(cuerpo);
        arbol.appendChild(cont);
    }

    function chip(tipo, ruta) {
        const t = TIPOS[tipo];
        const c = document.createElement('div');
        c.className = 'elemento-chip';
        c.draggable = true;
        c.innerHTML = '<span class="emoji">' + (t.emoji || '🧩') + '</span><span class="etq">' + t.label + '</span>' +
                      (ruta ? '<span style="font-size:10px;color:#a5a6c4;">' + ruta + '</span>' : '');
        c.title = 'Arrastra al lienzo o haz clic para añadirlo';
        c.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', tipo);
            e.dataTransfer.effectAllowed = 'copy';
        });
        c.addEventListener('click', () => colocarTipo(tipo, null, null));
        return c;
    }

    function renderSeccion(sec, esSub) {
        const cont = document.createElement('div');
        cont.className = 'seccion' + (sec.abierto ? '' : ' seccion-cerrada');
        const cab = document.createElement('div');
        cab.className = 'seccion-cabecera';
        cab.innerHTML =
            '<span class="flecha">▾</span>' +
            '<span class="nombre">' + esc(sec.nombre) + '</span>' +
            '<span class="contador">' + sec.tipos.length + '</span>' +
            '<span class="seccion-acciones">' +
                '<button class="mini" title="Añadir elemento" onclick="event.stopPropagation();abrirPopover(this,\'' + sec.id + '\')">＋</button>' +
                '<button class="mini" title="Añadir subsección" onclick="event.stopPropagation();nuevaSubseccion(\'' + sec.id + '\')">⤵</button>' +
                '<button class="mini" title="Renombrar" onclick="event.stopPropagation();renombrarSeccion(\'' + sec.id + '\')">✎</button>' +
                '<button class="mini" title="Subir (intercambiar arriba)" onclick="event.stopPropagation();moverSeccion(\'' + sec.id + '\',-1)">▲</button>' +
                '<button class="mini" title="Bajar" onclick="event.stopPropagation();moverSeccion(\'' + sec.id + '\',1)">▼</button>' +
                '<button class="mini del" title="Eliminar sección" onclick="event.stopPropagation();eliminarSeccion(\'' + sec.id + '\')">✕</button>' +
            '</span>';
        cab.addEventListener('click', () => { sec.abierto = !sec.abierto; renderPaleta(); });
        cont.appendChild(cab);

        const cuerpo = document.createElement('div');
        cuerpo.className = 'seccion-cuerpo';
        sec.tipos.forEach(t => cuerpo.appendChild(chip(t)));
        if (sec.subs.length) {
            const subs = document.createElement('div');
            subs.className = 'subsecciones';
            sec.subs.forEach(s => subs.appendChild(renderSeccion(s, true)));
            cuerpo.appendChild(subs);
        }
        if (!sec.tipos.length && !sec.subs.length) {
            cuerpo.appendChild(crearPista(esSub ? 'Subsección vacía' : 'Sección vacía'));
        }
        cont.appendChild(cuerpo);
        return cont;
    }

    function crearPista(txt) {
        const p = document.createElement('div');
        p.className = 'resultado-vacio';
        p.style.padding = '6px';
        p.textContent = txt;
        return p;
    }

    /* Gestión de secciones */
    function buscarSeccion(id, arr) {
        for (const s of arr) {
            if (s.id === id) return { sec: s, lista: arr };
            const r = buscarSeccion(id, s.subs);
            if (r) return r;
        }
        return null;
    }

    function nuevaSeccion(_ev, esSub) {
        const nombre = prompt('Nombre de la ' + (esSub ? 'subsección' : 'sección') + ':');
        if (!nombre) return;
        if (esSub) {
            const raiz = paleta[paleta.length - 1];
            if (!raiz) { paleta.push(nuevaSeccionObj(nombre, [])); }
            else raiz.subs.push(nuevaSeccionObj(nombre, []));
        } else {
            paleta.push(nuevaSeccionObj(nombre, []));
        }
        renderPaleta();
    }

    function nuevaSubseccion(id) {
        const nombre = prompt('Nombre de la subsección:');
        if (!nombre) return;
        const r = buscarSeccion(id, paleta);
        if (r) { r.sec.subs.push(nuevaSeccionObj(nombre, [])); renderPaleta(); }
    }

    function renombrarSeccion(id) {
        const r = buscarSeccion(id, paleta);
        if (!r) return;
        const nombre = prompt('Nuevo nombre:', r.sec.nombre);
        if (nombre) { r.sec.nombre = nombre; renderPaleta(); }
    }

    function moverSeccion(id, dir) {
        const r = buscarSeccion(id, paleta);
        if (!r) return;
        const lista = r.lista, i = lista.indexOf(r.sec);
        const j = i + dir;
        if (j < 0 || j >= lista.length) return;
        lista.splice(i, 1);
        lista.splice(j, 0, r.sec);
        renderPaleta();
    }

    function eliminarSeccion(id) {
        const r = buscarSeccion(id, paleta);
        if (!r) return;
        if (!confirm('¿Eliminar la sección «' + r.sec.nombre + '»?')) return;
        r.lista.splice(r.lista.indexOf(r.sec), 1);
        renderPaleta();
    }

    /* Popover para añadir elementos a una sección */
    function abrirPopover(btn, seccionId) {
        const pop = document.getElementById('popover');
        pop.innerHTML = '';
        CATEGORIAS.forEach(cat => {
            const tit = document.createElement('div');
            tit.className = 'cat';
            tit.textContent = cat;
            pop.appendChild(tit);
            Object.keys(TIPOS).filter(k => TIPOS[k].cat === cat).forEach(k => {
                const op = document.createElement('div');
                op.className = 'opcion';
                op.innerHTML = '<span>' + (TIPOS[k].emoji || '🧩') + '</span><span>' + TIPOS[k].label + '</span>';
                op.addEventListener('click', () => {
                    const r = buscarSeccion(seccionId, paleta);
                    if (r && !r.sec.tipos.includes(k)) r.sec.tipos.push(k);
                    pop.classList.remove('abierto');
                    renderPaleta();
                });
                pop.appendChild(op);
            });
        });
        const rect = btn.getBoundingClientRect();
        pop.style.left = Math.min(rect.left, window.innerWidth - 250) + 'px';
        pop.style.top = (rect.bottom + 4) + 'px';
        pop.classList.add('abierto');
    }
    document.addEventListener('click', e => {
        const pop = document.getElementById('popover');
        if (pop.classList.contains('abierto') && !pop.contains(e.target) && !e.target.closest('.mini')) {
            pop.classList.remove('abierto');
        }
    });

    function togglePanel() {
        document.getElementById('panel').classList.toggle('oculto');
    }

    /* ============================================================
       LIENZO
       ============================================================ */
    function nuevoElemento(tipo) {
        const t = TIPOS[tipo];
        const id = 'elem_' + contadorId++;
        elementos.set(id, {
            id, tipo,
            nombre: t.label,
            texto: t.texto,
            x: 0, y: 0, w: t.w, h: t.h,
            col: 1, fila: 1, spanCol: t.span, spanRow: Math.max(1, Math.round(t.h / ALTO_FILA)),
            padre: null, hijos: [],
            estilos: {
                color: t.color, fondo: t.bg, bordeColor: t.bordeColor || '#999999',
                borde: t.borde || 0, radio: t.radio || 0, padding: 6,
                fontSize: t.fontSize || 14, negrita: !!t.negrita, align: 'center',
                opacidad: 100, sombra: t.sombra || 'none'
            },
            anim: t.anim || 'ninguna'
        });
        return id;
    }

    function esContenedor(id) {
        const e = elementos.get(id);
        return e && !!TIPOS[e.tipo].hijos;
    }

    function celdaLibre(padreId) {
        const lista = padreId ? elementos.get(padreId).hijos : raices;
        const ocup = new Set();
        lista.forEach(id => { const e = elementos.get(id); ocup.add(e.col + ',' + e.fila); });
        for (let f = 1; f < 100; f++) {
            for (let c = 1; c <= COLUMNAS; c++) {
                if (!ocup.has(c + ',' + f)) return { col: c, fila: f };
            }
        }
        return { col: 1, fila: 1 };
    }

    function colocarTipo(tipo, clienteX, clienteY) {
        const id = nuevoElemento(tipo);
        const el = elementos.get(id);
        const t = TIPOS[tipo];

        let contenedor = null;
        if (clienteX != null) {
            const bajo = document.elementFromPoint(clienteX, clienteY);
            const nodoObj = bajo ? bajo.closest('.elemento-web') : null;
            if (nodoObj && esContenedor(nodoObj.dataset.id)) contenedor = elementos.get(nodoObj.dataset.id);
        }
        if (contenedor) {
            el.padre = contenedor.id;
            contenedor.hijos.push(id);
        }

        if (modo === 'libre') {
            const areaW = contenedor ? contenedor.w : lienzoAncho;
            const areaH = contenedor ? contenedor.h : lienzoAlto;
            if (clienteX != null) {
                const ref = contenedor
                    ? document.querySelector('[data-id="' + contenedor.id + '"]')
                    : document.getElementById('lienzo');
                const r = ref.getBoundingClientRect();
                el.x = clienteX - r.left - t.w / 2;
                el.y = clienteY - r.top - t.h / 2;
            } else {
                el.x = (areaW - t.w) / 2;
                el.y = (areaH - t.h) / 2;
            }
            el.x = Math.max(0, Math.min(el.x, areaW - t.w));
            el.y = Math.max(0, Math.min(el.y, areaH - t.h));
        } else {
            if (clienteX != null) {
                const ref = contenedor
                    ? document.querySelector('[data-id="' + contenedor.id + '"]')
                    : document.getElementById('lienzo');
                const r = ref.getBoundingClientRect();
                const colW = ((contenedor ? contenedor.w : lienzoAncho) - (COLUMNAS - 1) * GAP) / COLUMNAS;
                el.col = Math.max(1, Math.min(COLUMNAS, Math.round((clienteX - r.left - GAP / 2) / (colW + GAP)) + 1));
                el.fila = Math.max(1, Math.floor((clienteY - r.top) / (ALTO_FILA + GAP)) + 1);
                if (el.col + el.spanCol - 1 > COLUMNAS) el.spanCol = Math.max(1, COLUMNAS - el.col + 1);
            } else {
                const libre = celdaLibre(contenedor ? contenedor.id : null);
                el.col = libre.col; el.fila = libre.fila;
            }
        }

        if (!contenedor) raices.push(id);
        renderLienzo();
        setSeleccion(id);
    }

    /* Render del lienzo */
    function construirDOM(id) {
        const el = elementos.get(id);
        const t = TIPOS[el.tipo];
        const node = document.createElement('div');
        node.className = 'elemento-web' + (modo === 'cuadricula' ? ' cuadricula' : '');
        node.dataset.id = id;
        aplicarEstilos(node, el, false);

        if (el.hijos.length) node.classList.add('es-contenedor');

        if (t.hijos) {
            if (!el.hijos.length) {
                const p = document.createElement('div');
                p.className = 'pista';
                p.textContent = 'Suelta elementos aquí';
                node.appendChild(p);
            }
        } else {
            const txt = document.createElement('div');
            txt.className = 'el-texto';
            txt.textContent = el.texto || '';
            node.appendChild(txt);
        }
        el.hijos.forEach(h => node.appendChild(construirDOM(h)));
        return node;
    }

    function renderLienzo() {
        const lienzo = document.getElementById('lienzo');
        lienzo.innerHTML = '';
        lienzo.appendChild(crearMango());
        lienzo.appendChild(crearLabelMango());
        raices.forEach(id => lienzo.appendChild(construirDOM(id)));
        aplicarFondo();
        ajustarTracksContenedores();
        setSeleccion(seleccionId);
        actualizarLabelMango();
    }

    function ajustarTracksContenedores() {
        if (modo !== 'cuadricula') return;
        document.querySelectorAll('.elemento-web.es-contenedor').forEach(node => {
            const w = node.getBoundingClientRect().width;
            if (w > 20) {
                const cw = (w - (COLUMNAS - 1) * GAP) / COLUMNAS;
                node.style.gridTemplateColumns = 'repeat(' + COLUMNAS + ', ' + cw + 'px)';
            }
        });
    }

    function crearMango() {
        const m = document.createElement('div');
        m.id = 'mango-lienzo';
        m.title = 'Arrastra para redimensionar el lienzo';
        return m;
    }

    function crearLabelMango() {
        const l = document.createElement('div');
        l.className = 'mango-label';
        l.id = 'label-mango';
        l.textContent = lienzoAncho + ' × ' + lienzoAlto;
        return l;
    }
    function actualizarLabelMango() {
        const l = document.getElementById('label-mango');
        if (l) l.textContent = lienzoAncho + ' × ' + lienzoAlto;
    }

    function aplicarEstilos(node, el, esLive) {
        const s = el.estilos;
        node.style.color = s.color;
        node.style.background = s.fondo === 'transparent' ? 'transparent' : s.fondo;
        node.style.opacity = (s.opacidad / 100).toFixed(2);
        node.style.border = (s.borde > 0 ? s.borde + 'px solid ' + s.bordeColor : 'none');
        node.style.borderRadius = s.radio + 'px';
        node.style.padding = s.padding + 'px';
        node.style.fontSize = s.fontSize + 'px';
        node.style.fontWeight = s.negrita ? '700' : '400';
        node.style.textAlign = s.align;
        node.style.boxShadow = s.sombra === 'soft' ? '0 4px 12px rgba(0,0,0,.14)' :
                              (s.sombra === 'strong' ? '0 8px 26px rgba(0,0,0,.28)' : 'none');

        if (modo === 'libre') {
            node.style.left = el.x + 'px';
            node.style.top = el.y + 'px';
            node.style.width = el.w + 'px';
            node.style.height = el.h + 'px';
        } else {
            node.style.gridColumn = el.col + ' / span ' + el.spanCol;
            node.style.gridRow = el.fila + ' / span ' + el.spanRow;
            if (el.hijos.length) {
                node.style.display = 'grid';
                node.style.alignContent = 'start';
                const innerW = Math.max(40, (modo === 'libre' ? el.w : 400));
                const cw = (innerW - (COLUMNAS - 1) * GAP) / COLUMNAS;
                node.style.gridTemplateColumns = 'repeat(' + COLUMNAS + ', ' + cw + 'px)';
                node.style.gridAutoRows = ALTO_FILA + 'px';
                node.style.gridColumnGap = GAP + 'px';
                node.style.gridRowGap = GAP + 'px';
            }
        }

        // Animación
        ['anim-fade','anim-pulse','anim-spin','anim-bounce','anim-slide','anim-carga']
            .forEach(c => node.classList.remove(c));
        if (el.anim !== 'ninguna') node.classList.add('anim-' + el.anim);
    }

    function aplicarFondo() {
        const lienzo = document.getElementById('lienzo');
        lienzo.style.width = lienzoAncho + 'px';
        lienzo.style.height = lienzoAlto + 'px';
        lienzo.style.background = lienzoFondo;
        if (modo === 'cuadricula') {
            const colW = (lienzoAncho - (COLUMNAS - 1) * GAP) / COLUMNAS;
            lienzo.classList.add('modo-cuadricula');
            lienzo.style.gridTemplateColumns = 'repeat(' + COLUMNAS + ', ' + colW + 'px)';
            lienzo.style.gridAutoRows = ALTO_FILA + 'px';
            lienzo.style.gridColumnGap = GAP + 'px';
            lienzo.style.gridRowGap = GAP + 'px';
            lienzo.style.backgroundImage =
                'linear-gradient(to right, rgba(37,99,235,.06) 1px, transparent 1px), ' +
                'linear-gradient(to bottom, rgba(37,99,235,.06) 1px, transparent 1px)';
            lienzo.style.backgroundSize = (colW + GAP) + 'px ' + (ALTO_FILA + GAP) + 'px';
        } else {
            lienzo.classList.remove('modo-cuadricula');
            lienzo.style.gridTemplateColumns = '';
            lienzo.style.gridAutoRows = '';
            lienzo.style.backgroundImage = 'none';
        }
        document.getElementById('ent-ancho').value = lienzoAncho;
        document.getElementById('ent-alto').value = lienzoAlto;
        document.getElementById('ent-fondo').value = lienzoFondo;
    }

    /* ============================================================
       SELECCIÓN Y ARRASTRE DENTRO DEL LIENZO
       ============================================================ */
    function setSeleccion(id) {
        document.querySelectorAll('.elemento-web.seleccionado').forEach(n => {
            n.classList.remove('seleccionado');
            n.querySelectorAll('.handle').forEach(h => h.remove());
        });
        seleccionId = id;
        if (id && elementos.has(id)) {
            const node = document.querySelector('[data-id="' + id + '"]');
            if (node) {
                node.classList.add('seleccionado');
                crearHandles(node);
            }
        }
        sincronizarEditor();
    }

    function crearHandles(node) {
        const dirs = modo === 'cuadricula' ? ['e', 's', 'se'] : ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
        dirs.forEach(d => {
            const h = document.createElement('div');
            h.className = 'handle ' + d;
            h.dataset.dir = d;
            node.appendChild(h);
        });
    }

    /* Arrastre de elementos ya existentes */
    document.getElementById('lienzo').addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        if (e.target.closest('.handle')) return; // lo maneja el redimensionado
        if (e.target.id === 'mango-lienzo') return;
        const node = e.target.closest('.elemento-web');
        if (!node) return;

        const id = node.dataset.id;
        const el = elementos.get(id);
        setSeleccion(id);
        if (!el) return;

        const cont = el.padre ? elementos.get(el.padre) : null;
        const ref = cont
            ? document.querySelector('[data-id="' + cont.id + '"]')
            : document.getElementById('lienzo');
        const refRect = ref.getBoundingClientRect();

        const inicioX = e.clientX, inicioY = e.clientY;
        const origX = el.x, origY = el.y;
        const origCol = el.col, origFila = el.fila;
        let movido = false;

        function alMover(ev) {
            if (modo === 'libre') {
                const areaW = cont ? cont.w : lienzoAncho;
                const areaH = cont ? cont.h : lienzoAlto;
                el.x = Math.max(0, Math.min(origX + (ev.clientX - inicioX), areaW - el.w));
                el.y = Math.max(0, Math.min(origY + (ev.clientY - inicioY), areaH - el.h));
            } else {
                const colW = ((cont ? cont.w : lienzoAncho) - (COLUMNAS - 1) * GAP) / COLUMNAS;
                const rr = ref.getBoundingClientRect();
                const col = Math.max(1, Math.min(COLUMNAS, Math.round((ev.clientX - rr.left - GAP / 2) / (colW + GAP)) + 1));
                const fila = Math.max(1, Math.floor((ev.clientY - rr.top) / (ALTO_FILA + GAP)) + 1);
                if (el.col !== col || el.fila !== fila) {
                    el.col = col; el.fila = fila;
                    aplicarEstilos(document.querySelector('[data-id="' + id + '"]'), el, true);
                }
            }
            movido = true;
        }
        function alSoltar() {
            document.removeEventListener('mousemove', alMover);
            document.removeEventListener('mouseup', alSoltar);
            if (modo === 'libre' && movido) {
                aplicarEstilos(document.querySelector('[data-id="' + id + '"]'), el, true);
            }
        }
        document.addEventListener('mousemove', alMover);
        document.addEventListener('mouseup', alSoltar);
    });

    /* Redimensionar con mangos */
    document.getElementById('lienzo').addEventListener('mousedown', e => {
        const h = e.target.closest('.handle');
        if (!h) return;
        e.preventDefault();
        e.stopPropagation();
        const node = h.closest('.elemento-web');
        const id = node.dataset.id;
        const el = elementos.get(id);
        const dir = h.dataset.dir;
        const inicioX = e.clientX, inicioY = e.clientY;
        const oX = el.x, oY = el.y, oW = el.w, oH = el.h;
        const oCol = el.col, oFila = el.fila, oSC = el.spanCol, oSR = el.spanRow;

        function alMover(ev) {
            const dx = ev.clientX - inicioX;
            const dy = ev.clientY - inicioY;
            if (modo === 'libre') {
                if (dir.includes('e')) el.w = Math.max(20, oW + dx);
                if (dir.includes('s')) el.h = Math.max(20, oH + dy);
                if (dir.includes('w')) { el.w = Math.max(20, oW - dx); el.x = oX + (oW - el.w); }
                if (dir.includes('n')) { el.h = Math.max(20, oH - dy); el.y = oY + (oH - el.h); }
                aplicarEstilos(document.querySelector('[data-id="' + id + '"]'), el, true);
            } else {
                const cont = el.padre ? elementos.get(el.padre) : null;
                const ref = cont
                    ? document.querySelector('[data-id="' + cont.id + '"]')
                    : document.getElementById('lienzo');
                const colW = ((cont ? cont.w : lienzoAncho) - (COLUMNAS - 1) * GAP) / COLUMNAS;
                const colD = Math.round(dx / (colW + GAP));
                const filaD = Math.round(dy / (ALTO_FILA + GAP));
                if (dir.includes('e')) el.spanCol = Math.max(1, Math.min(COLUMNAS, oSC + colD));
                if (dir.includes('s')) el.spanRow = Math.max(1, oSR + filaD);
                if (dir === 'se') {
                    el.col = Math.max(1, Math.min(COLUMNAS, oCol));
                    if (el.col + el.spanCol - 1 > COLUMNAS) el.spanCol = COLUMNAS - el.col + 1;
                }
                aplicarEstilos(document.querySelector('[data-id="' + id + '"]'), el, true);
            }
        }
        function alSoltar() {
            document.removeEventListener('mousemove', alMover);
            document.removeEventListener('mouseup', alSoltar);
            sincronizarEditor();
        }
        document.addEventListener('mousemove', alMover);
        document.addEventListener('mouseup', alSoltar);
    });

    /* Clic derecho → abrir panel de edición */
    document.getElementById('lienzo').addEventListener('contextmenu', e => {
        const node = e.target.closest('.elemento-web');
        if (node) {
            e.preventDefault();
            setSeleccion(node.dataset.id);
            abrirEditor();
        }
    });

    /* Clic en lienzo vacío → deseleccionar */
    document.getElementById('lienzo').addEventListener('mousedown', e => {
        if (e.target.id === 'lienzo' || e.target.classList.contains('mango-label')) setSeleccion(null);
    });

    /* Soltar desde la paleta */
    document.getElementById('lienzo').addEventListener('dragover', e => e.preventDefault());
    document.getElementById('lienzo').addEventListener('drop', e => {
        e.preventDefault();
        const tipo = e.dataTransfer.getData('text/plain');
        if (tipo && TIPOS[tipo]) colocarTipo(tipo, e.clientX, e.clientY);
    });

    /* ============================================================
       MODOS: CUADRÍCULA / LIBRE
       ============================================================ */
    function toggleModo() {
        cambiarModo(modo === 'cuadricula' ? 'libre' : 'cuadricula');
    }
    function cambiarModo(nuevo) {
        if (modo === nuevo) return;
        if (nuevo === 'cuadricula') convertirLibreAGrid();
        else convertirGridALibre();
        modo = nuevo;
        document.getElementById('lienzo').classList.toggle('cuadricula', modo === 'cuadricula');
        document.getElementById('btn-modo').textContent = modo === 'cuadricula' ? '▦ Modo cuadrícula' : '🎯 Modo libre';
        renderLienzo();
        actualizarLabelMango();
    }

    function convertirGridALibre(padreId, padreW) {
        const lista = padreId ? elementos.get(padreId).hijos : raices;
        const w = padreW != null ? padreW : lienzoAncho;
        const colW = (w - (COLUMNAS - 1) * GAP) / COLUMNAS;
        lista.forEach(id => {
            const el = elementos.get(id);
            el.x = (el.col - 1) * (colW + GAP);
            el.y = (el.fila - 1) * (ALTO_FILA + GAP);
            el.w = el.spanCol * colW + (el.spanCol - 1) * GAP;
            el.h = el.spanRow * ALTO_FILA + (el.spanRow - 1) * GAP;
            convertirGridALibre(id, el.w);
        });
    }

    function convertirLibreAGrid(padreId, padreW) {
        const lista = padreId ? elementos.get(padreId).hijos : raices;
        const w = padreW != null ? padreW : lienzoAncho;
        const colW = (w - (COLUMNAS - 1) * GAP) / COLUMNAS;
        lista.forEach(id => {
            const el = elementos.get(id);
            el.col = Math.max(1, Math.min(COLUMNAS, Math.round(el.x / (colW + GAP)) + 1));
            el.spanCol = Math.max(1, Math.min(COLUMNAS - el.col + 1, Math.round(el.w / (colW + GAP))));
            el.fila = Math.max(1, Math.round(el.y / (ALTO_FILA + GAP)) + 1);
            el.spanRow = Math.max(1, Math.round(el.h / (ALTO_FILA + GAP)));
            convertirLibreAGrid(id, el.w);
        });
    }

    /* Auto-acomodar en cuadrículas */
    function autoAcomodar() {
        if (modo !== 'cuadricula') cambiarModo('cuadricula');
        function acomodar(lista) {
            let col = 1, fila = 1;
            lista.forEach(id => {
                const el = elementos.get(id);
                if (col + el.spanCol - 1 > COLUMNAS) { col = 1; fila++; }
                el.col = col;
                el.fila = fila;
                col += el.spanCol;
                if (el.hijos.length) acomodar(el.hijos);
            });
        }
        acomodar(raices);
        renderLienzo();
    }

    /* ============================================================
       TAMAÑO DEL LIENZO
       ============================================================ */
    function aplicarTamanoLienzo() {
        lienzoAncho = clamp(parseInt(document.getElementById('ent-ancho').value) || 800, 200, 4000);
        lienzoAlto = clamp(parseInt(document.getElementById('ent-alto').value) || 600, 150, 3000);
        aplicarFondo();
        renderLienzo();
    }
    function aplicarPreset() {
        const v = document.getElementById('sel-preset').value;
        if (!v) return;
        const [a, h] = v.split(',');
        lienzoAncho = +a; lienzoAlto = +h;
        document.getElementById('sel-preset').value = '';
        aplicarFondo();
        renderLienzo();
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    /* Redimensionar arrastrando el mango */
    document.getElementById('lienzo').addEventListener('mousedown', e => {
        if (e.target.id !== 'mango-lienzo') return;
        e.preventDefault();
        e.stopPropagation();
        const inicioX = e.clientX, inicioY = e.clientY;
        const oW = lienzoAncho, oH = lienzoAlto;
        function alMover(ev) {
            lienzoAncho = clamp(oW + (ev.clientX - inicioX), 200, 4000);
            lienzoAlto = clamp(oH + (ev.clientY - inicioY), 150, 3000);
            aplicarFondo();
            actualizarLabelMango();
        }
        function alSoltar() {
            document.removeEventListener('mousemove', alMover);
            document.removeEventListener('mouseup', alSoltar);
            renderLienzo();
        }
        document.addEventListener('mousemove', alMover);
        document.addEventListener('mouseup', alSoltar);
    });

    /* ============================================================
       PANEL DE EDICIÓN
       ============================================================ */
    function abrirEditor() {
        document.getElementById('panel-editor').classList.add('abierto');
        sincronizarEditor();
    }
    function cerrarEditor() {
        document.getElementById('panel-editor').classList.remove('abierto');
    }
    function sincronizarEditor() {
        const cuerpo = document.getElementById('editor-cuerpo');
        const etq = document.getElementById('etiqueta-tipo');
        const el = seleccionId ? elementos.get(seleccionId) : null;
        if (!el) {
            cuerpo.innerHTML = '<div class="resultado-vacio">Haz clic derecho sobre un elemento del lienzo para editarlo.</div>';
            etq.textContent = 'Sin selección';
            return;
        }
        const t = TIPOS[el.tipo];
        etq.textContent = t.label;

        const filaC = (label, contenido) => {
            const g = document.createElement('div');
            g.className = 'grupo';
            const l = document.createElement('label');
            l.textContent = label;
            g.appendChild(l);
            const f = document.createElement('div');
            f.className = 'fila';
            f.appendChild(contenido);
            g.appendChild(f);
            return g;
        };

        const fNombre = document.createElement('input');
        fNombre.type = 'text';
        fNombre.value = el.nombre;
        fNombre.oninput = () => { el.nombre = fNombre.value; };

        const fTexto = document.createElement('textarea');
        fTexto.value = el.texto;
        fTexto.oninput = () => {
            el.texto = fTexto.value;
            const node = document.querySelector('[data-id="' + seleccionId + '"] .el-texto');
            if (node) node.textContent = el.texto;
        };

        const fColor = creadorColor('color', 'Color del texto');
        const fFondo = creadorColor('fondo', 'Color de fondo');
        const fBordeColor = creadorColor('bordeColor', 'Color del borde');
        const rBorde = creadorRange('borde', 0, 10, 'px');
        const rRadio = creadorRange('radio', 0, 40, 'px');
        const rPadding = creadorRange('padding', 0, 40, 'px');
        const rFont = creadorRange('fontSize', 10, 48, 'px');
        const rOpacidad = creadorRange('opacidad', 10, 100, '%');
        const cNegrita = creadorCheck('negrita', 'Negrita');

        const sAlign = document.createElement('select');
        ['left','center','right','justify'].forEach(v => {
            const o = document.createElement('option');
            o.value = v; o.textContent = v === 'left' ? 'Izquierda' : v === 'center' ? 'Centro' : v === 'right' ? 'Derecha' : 'Justificado';
            sAlign.appendChild(o);
        });
        sAlign.value = el.estilos.align;
        sAlign.onchange = () => { el.estilos.align = sAlign.value; aplicarLive(); };

        const sSombra = document.createElement('select');
        [['none','Sin sombra'],['soft','Sombra suave'],['strong','Sombra fuerte']].forEach(p => {
            const o = document.createElement('option');
            o.value = p[0]; o.textContent = p[1];
            sSombra.appendChild(o);
        });
        sSombra.value = el.estilos.sombra;
        sSombra.onchange = () => { el.estilos.sombra = sSombra.value; aplicarLive(); };

        const sAnim = document.createElement('select');
        [['ninguna','Sin animación'],['fade','Fade (aparecer)'],['pulse','Pulso'],['spin','Girar'],['bounce','Rebote'],['slide','Deslizar'],['carga','Brillo de carga']].forEach(p => {
            const o = document.createElement('option');
            o.value = p[0]; o.textContent = p[1];
            sAnim.appendChild(o);
        });
        sAnim.value = el.anim;
        sAnim.onchange = () => { el.anim = sAnim.value; aplicarLive(); };

        cuerpo.innerHTML = '';
        cuerpo.appendChild(filaC('Nombre', fNombre));
        if (!t.hijos) cuerpo.appendChild(filaC('Contenido', fTexto));
        cuerpo.appendChild(filaC('Color del texto', fColor));
        cuerpo.appendChild(filaC('Color de fondo', fFondo));
        if (el.estilos.borde > 0) cuerpo.appendChild(filaC('Color del borde', fBordeColor));
        cuerpo.appendChild(filaC('Grosor del borde', rBorde));
        cuerpo.appendChild(filaC('Esquinas (radio)', rRadio));
        cuerpo.appendChild(filaC('Relleno interior', rPadding));
        cuerpo.appendChild(filaC('Tamaño de fuente', rFont));
        cuerpo.appendChild(filaC('Alineación', sAlign));
        cuerpo.appendChild(filaC('Opacidad', rOpacidad));
        cuerpo.appendChild(filaC('Sombra', sSombra));
        cuerpo.appendChild(filaC('Animación', sAnim));

        const gNeg = document.createElement('div');
        gNeg.className = 'grupo';
        const fNeg = document.createElement('div');
        fNeg.className = 'fila-cb';
        fNeg.appendChild(cNegrita);
        const lNeg = document.createElement('label');
        lNeg.textContent = 'Negrita';
        lNeg.style.textTransform = 'none';
        fNeg.appendChild(lNeg);
        gNeg.appendChild(fNeg);
        cuerpo.appendChild(gNeg);

        if (modo === 'libre') {
            const nW = document.createElement('input');
            nW.type = 'number'; nW.value = Math.round(el.w);
            nW.onchange = () => { el.w = Math.max(20, +nW.value || 20); aplicarLive(); };
            const nH = document.createElement('input');
            nH.type = 'number'; nH.value = Math.round(el.h);
            nH.onchange = () => { el.h = Math.max(20, +nH.value || 20); aplicarLive(); };
            cuerpo.appendChild(filaC('Ancho (px)', nW));
            cuerpo.appendChild(filaC('Alto (px)', nH));
        } else {
            cuerpo.appendChild(filaC('Columnas que ocupa', creadorSpanRange('spanCol', COLUMNAS, ' cols')));
            cuerpo.appendChild(filaC('Filas que ocupa', creadorSpanRange('spanRow', 12, ' filas')));
        }

        if (el.padre) {
            const gPadre = document.createElement('div');
            gPadre.className = 'grupo';
            const lp = document.createElement('label');
            lp.textContent = 'Sección contenedora: ' + (elementos.get(el.padre) ? elementos.get(el.padre).nombre : '');
            gPadre.appendChild(lp);
            cuerpo.appendChild(gPadre);
        }

        function creadorColor(campo, titulo) {
            const c = document.createElement('input');
            c.type = 'color';
            c.value = el.estilos[campo];
            c.title = titulo;
            c.oninput = () => { el.estilos[campo] = c.value; aplicarLive(); };
            return c;
        }
        function creadorRange(campo, min, max, sufijo) {
            const r = document.createElement('input');
            r.type = 'range'; r.min = min; r.max = max;
            r.value = el.estilos[campo];
            const val = document.createElement('span');
            val.className = 'valor';
            val.textContent = r.value + sufijo;
            r.oninput = () => {
                el.estilos[campo] = +r.value;
                val.textContent = r.value + sufijo;
                aplicarLive();
            };
            const f = document.createElement('div');
            f.className = 'fila';
            f.appendChild(r);
            f.appendChild(val);
            return f;
        }
        function creadorSpanRange(campo, max, sufijo) {
            const r = document.createElement('input');
            r.type = 'range'; r.min = 1; r.max = max;
            r.value = el[campo];
            const val = document.createElement('span');
            val.className = 'valor';
            val.textContent = r.value + sufijo;
            r.oninput = () => {
                el[campo] = +r.value;
                val.textContent = r.value + sufijo;
                const node = document.querySelector('[data-id="' + seleccionId + '"]');
                if (node) aplicarEstilos(node, el, true);
            };
            const f = document.createElement('div');
            f.className = 'fila';
            f.appendChild(r);
            f.appendChild(val);
            return f;
        }
        function creadorCheck(campo, titulo) {
            const c = document.createElement('input');
            c.type = 'checkbox';
            c.checked = !!el.estilos[campo];
            c.title = titulo;
            c.onchange = () => { el.estilos[campo] = c.checked; aplicarLive(); };
            return c;
        }
    }

    function aplicarLive() {
        const node = document.querySelector('[data-id="' + seleccionId + '"]');
        if (node) aplicarEstilos(node, elementos.get(seleccionId), true);
    }

    function accionEditor(accion) {
        const id = seleccionId;
        if (!id || !elementos.has(id)) return;
        const el = elementos.get(id);
        const lista = el.padre ? elementos.get(el.padre).hijos : raices;
        const i = lista.indexOf(id);

        if (accion === 'subir' && i > 0) { lista.splice(i, 1); lista.splice(i - 1, 0, id); }
        else if (accion === 'bajar' && i < lista.length - 1) { lista.splice(i, 1); lista.splice(i + 1, 0, id); }
        else if (accion === 'desanidar' && el.padre) {
            const padre = elementos.get(el.padre);
            padre.hijos.splice(padre.hijos.indexOf(id), 1);
            el.padre = null;
            raices.push(id);
        }
        else if (accion === 'duplicar') { duplicar(id); return; }
        else if (accion === 'eliminar') {
            lista.splice(i, 1);
            eliminarSubarbol(id);
            seleccionId = null;
        }
        renderLienzo();
        if (seleccionId) setSeleccion(seleccionId);
        sincronizarEditor();
    }

    function eliminarSubarbol(id) {
        const el = elementos.get(id);
        if (!el) return;
        el.hijos.forEach(eliminarSubarbol);
        elementos.delete(id);
    }

    function duplicar(id) {
        const orig = elementos.get(id);
        const mapa = new Map();
        function copiar(oid) {
            const o = elementos.get(oid);
            const n = Object.assign({}, o, {
                id: 'elem_' + contadorId++,
                hijos: [],
                x: o.x + 14, y: o.y + 14, col: o.col + 1
            });
            n.estilos = Object.assign({}, o.estilos);
            mapa.set(oid, n.id);
            elementos.set(n.id, n);
            o.hijos.forEach(ch => { const nid = copiar(ch); n.hijos.push(nid); elementos.get(nid).padre = n.id; });
            return n.id;
        }
        const nid = copiar(id);
        elementos.get(nid).padre = orig.padre;
        const lista = orig.padre ? elementos.get(orig.padre).hijos : raices;
        lista.splice(lista.indexOf(id) + 1, 0, nid);
        renderLienzo();
        setSeleccion(nid);
    }

    /* ============================================================
       EXPORTAR JSON
       ============================================================ */
    function exportar() {
        const datos = {
            herramienta: 'PromptBlueprint',
            version: '1.0.0',
            descripcion: 'Diseño exportado para que una IA construya la interfaz web. Los elementos anidados representan subsecciones (menús con submenús).',
            modo: modo,
            lienzo: { ancho: lienzoAncho, alto: lienzoAlto, fondo: lienzoFondo, columnas: COLUMNAS },
            elementos: raices.map(id => jsonElemento(id))
        };
        document.getElementById('json-salida').value = JSON.stringify(datos, null, 2);
        document.getElementById('modal-exportar').classList.add('abierto');
    }

    function jsonElemento(id) {
        const el = elementos.get(id);
        const t = TIPOS[el.tipo];
        const base = {
            id: el.id,
            tipo: el.tipo,
            etiqueta: t.label,
            nombre: el.nombre,
            texto: el.texto,
            posicion: modo === 'libre'
                ? { x: Math.round(el.x), y: Math.round(el.y) }
                : { columna: el.col, fila: el.fila },
            dimensiones: modo === 'libre'
                ? { ancho: Math.round(el.w), alto: Math.round(el.h) }
                : { spanCol: el.spanCol, spanRow: el.spanRow }
        };
        if (el.estilos) {
            base.estilos = {
                color: el.estilos.color,
                fondo: el.estilos.fondo,
                borde: el.estilos.borde,
                bordeColor: el.estilos.bordeColor,
                radio: el.estilos.radio,
                padding: el.estilos.padding,
                fontSize: el.estilos.fontSize,
                negrita: el.estilos.negrita,
                alinear: el.estilos.align,
                opacidad: el.estilos.opacidad,
                sombra: el.estilos.sombra
            };
        }
        if (el.anim !== 'ninguna') base.animacion = el.anim;
        if (el.hijos.length) base.subsecciones = el.hijos.map(jsonElemento);
        return base;
    }

    function cerrarModal() { document.getElementById('modal-exportar').classList.remove('abierto'); }
    function copiarJson() {
        const t = document.getElementById('json-salida');
        t.select();
        t.setSelectionRange(0, t.value.length);
        navigator.clipboard && navigator.clipboard.writeText(t.value);
    }
    function descargarJson() {
        const t = document.getElementById('json-salida').value;
        const blob = new Blob([t], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'PromptBlueprint_diseño.json';
        a.click();
        URL.revokeObjectURL(a.href);
    }
    document.getElementById('modal-exportar').addEventListener('mousedown', e => {
        if (e.target.id === 'modal-exportar') cerrarModal();
    });
    document.getElementById('json-salida').addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'a') { e.preventDefault(); const t = e.target; t.select(); t.setSelectionRange(0, t.value.length); }
    });

        ['¿Cómo intercambio el orden de arriba o abajo?', 'En la paleta, pasa el ratón sobre la cabecera de una sección y usa ▲/▼. En el lienzo, selecciona un elemento con clic derecho y usa "Subir" / "Bajar" en el panel de propiedades.'],
        ['¿Cómo cambio el tamaño del lienzo?', 'Arrastra la esquina inferior derecha del lienzo, o edita los campos de ancho y alto en la barra superior. También hay tamaños predefinidos en "Presets…" (Escritorio, Tablet, Móvil).'],

        ['¿Cómo exporto el diseño para mi IA?', 'Pulsa "Exportar JSON". El código incluye el lienzo, el modo, y todos los elementos con posición, estilo y subsecciones anidadas. Cópialo o descárgalo y pásaselo a la IA para que construya la web.'],
        ['¿Puedo ocultar la paleta de elementos?', 'Sí, usa el botón "◧ Panel" de la barra superior para mostrarla u ocultarla y ganar espacio para el lienzo.'],
        ['¿Cómo elimino o duplico un elemento?', 'Selecciónalo con clic derecho y usa los botones del panel de propiedades: "⧉ Duplicar" o "✕ Eliminar".']

    function renderFaq() {
        const cuerpo = document.getElementById('faq-cuerpo');
        cuerpo.innerHTML = '';
        FAQ.forEach((p, i) => {
            const item = document.createElement('div');
            item.className = 'faq-item';
            item.innerHTML =
                '<div class="faq-pregunta"><span class="num">' + (i + 1) + '</span><span>' + p[0] + '</span></div>' +
                '<div class="faq-respuesta">' + p[1] + '</div>';
            item.querySelector('.faq-pregunta').addEventListener('click', () => item.classList.toggle('abierto'));
            cuerpo.appendChild(item);
        });
    }

    function toggleFaq() {
        const pf = document.getElementById('panel-faq');
        pf.classList.toggle('abierto');
        if (pf.classList.contains('abierto')) renderFaq();
    }

        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
